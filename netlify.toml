# Netlify configuration for the Agent-Memory site.
#
# Layout served:
#   /        → hand-written landing page (website/)
#   /docs/   → mdBook documentation (built from docs/book/ at deploy time)
#
# The build step downloads a pinned mdBook binary (no Rust toolchain needed in
# the build image) and renders the book into website/docs, which is then
# published alongside the static landing page.

[build]
  publish = "website"
  command = "bash netlify/build.sh"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
