[book]
title = "Agent-Memory"
authors = ["Autonomyx / OpenAutonomyx"]
description = "Open memory layer for AI agents — embedded SurrealDB, Ebbinghaus decay, episodic replay, and conflict resolution."
language = "en"
src = "src"

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/AGenNext/Agent-Memory"
edit-url-template = "https://github.com/AGenNext/Agent-Memory/edit/main/docs/book/{path}"
additional-css = ["theme/custom.css"]

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
